services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gestasports-app:latest
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "3333:3333"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3333/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
